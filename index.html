<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Field Manual</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #12151c;
      --surface-2: #171b24;
      --border: #262b38;
      --text: #e6e8ee;
      --text-dim: #9199ac;
      --text-faint: #6b7385;
      --accent: #e0a83a;
      --accent-strong: #f2c268;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.6);
      --font: "IBM Plex Sans", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text); font-family: var(--font);
      padding: 24px; position: relative; overflow: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .35;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(224,168,58,.12), transparent 55%),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,.015) 2px, rgba(255,255,255,.015) 3px);
    }
    #boot {
      position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
      background: var(--bg); transition: opacity .45s ease, visibility .45s ease;
    }
    #boot.done { opacity: 0; visibility: hidden; pointer-events: none; }
    .boot-panel {
      width: min(420px, 92vw); font-family: var(--mono); font-size: 13px; line-height: 1.7;
      color: var(--text-dim);
    }
    .boot-brand { color: var(--accent); font-weight: 500; margin-bottom: 14px; letter-spacing: .4px; }
    .boot-line { opacity: 0; transform: translateY(4px); animation: bootIn .35s ease forwards; }
    .boot-line:nth-child(2) { animation-delay: .12s; }
    .boot-line:nth-child(3) { animation-delay: .28s; }
    .boot-line:nth-child(4) { animation-delay: .44s; }
    .boot-line:nth-child(5) { animation-delay: .6s; }
    .boot-ok { color: #5fc37e; }
    .boot-bar {
      margin-top: 16px; height: 3px; border-radius: 2px; background: var(--border); overflow: hidden;
    }
    .boot-bar > span {
      display: block; height: 100%; width: 0; background: var(--accent);
      animation: bootBar 1.1s ease forwards;
    }
    @keyframes bootIn { to { opacity: 1; transform: none; } }
    @keyframes bootBar { to { width: 100%; } }
    #gate {
      width: min(400px, 100%); opacity: 0; transform: translateY(14px);
      transition: opacity .4s ease, transform .4s ease;
      position: relative; z-index: 1;
    }
    #gate.show { opacity: 1; transform: none; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .card:hover { border-color: #32384a; box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 16px 40px -14px rgba(0,0,0,.7); }
    h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.2px; }
    .lede { margin: 0 0 20px; color: var(--text-dim); font-size: 14px; line-height: 1.5; }
    label { display: block; font-size: 12px; color: var(--text-faint); margin-bottom: 6px; font-weight: 600; }
    input[type="password"] {
      width: 100%; height: 40px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text); padding: 0 12px; margin-bottom: 10px;
      font-family: var(--mono); font-size: 14px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:hover { border-color: #32384a; }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .err { color: #ef6f5b; font-size: 13px; min-height: 1.2em; margin: 0 0 10px; }
    .row { display: flex; justify-content: flex-end; }
    button {
      height: 38px; padding: 0 18px; border: none; border-radius: 8px; cursor: pointer;
      background: var(--accent); color: #1a1408; font-weight: 600; font-size: 14px; font-family: var(--font);
      transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
    }
    button:hover { background: var(--accent-strong); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(224,168,58,.25); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.65; cursor: wait; transform: none; box-shadow: none; }
    @media (prefers-reduced-motion: reduce) {
      #boot, #gate, .boot-line, .boot-bar > span, .card, button, input { animation: none !important; transition: none !important; }
      #gate { opacity: 1; transform: none; }
      #boot.done { display: none; }
    }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="false">
    <div class="boot-panel">
      <div class="boot-brand">FIELD MANUAL // BOOT</div>
      <div class="boot-line">&gt; init operator shell …</div>
      <div class="boot-line">&gt; load module index … <span class="boot-ok">ok</span></div>
      <div class="boot-line">&gt; mount field notes … <span class="boot-ok">ok</span></div>
      <div class="boot-line">&gt; await access key</div>
      <div class="boot-bar"><span></span></div>
    </div>
  </div>
  <div id="gate">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="t">
      <h1 id="t">Field Manual</h1>
      <p class="lede">AD / Internal Pentest — enter access key to open.</p>
      <form id="f" autocomplete="off" method="post" action="#">
        <label for="pw">Access key</label>
        <input id="pw" name="fm-access" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" required />
        <p class="err" id="err" role="alert"></p>
        <div class="row">
          <button type="submit" id="go">Unlock</button>
        </div>
      </form>
    </div>
  </div>
  <script src="gate.js"></script>
</body>
</html>
