<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Field Manual</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #12151c;
      --surface-2: #171b24;
      --border: #262b38;
      --text: #e6e8ee;
      --text-dim: #9199ac;
      --text-faint: #6b7385;
      --accent: #e0a83a;
      --accent-strong: #f2c268;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.6);
      --font: "IBM Plex Sans", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text); font-family: var(--font);
      padding: 24px;
    }
    .card {
      width: min(400px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
    }
    h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.2px; }
    .lede { margin: 0 0 20px; color: var(--text-dim); font-size: 14px; line-height: 1.5; }
    label { display: block; font-size: 12px; color: var(--text-faint); margin-bottom: 6px; font-weight: 600; }
    input[type="password"] {
      width: 100%; height: 40px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text); padding: 0 12px; margin-bottom: 10px;
      font-family: var(--mono); font-size: 14px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .err { color: #ef6f5b; font-size: 13px; min-height: 1.2em; margin: 0 0 10px; }
    .row { display: flex; justify-content: flex-end; }
    button {
      height: 38px; padding: 0 18px; border: none; border-radius: 8px; cursor: pointer;
      background: var(--accent); color: #1a1408; font-weight: 600; font-size: 14px; font-family: var(--font);
    }
    button:hover { background: var(--accent-strong); }
    button:disabled { opacity: 0.65; cursor: wait; }
  </style>
</head>
<body>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="t">
    <h1 id="t">Field Manual</h1>
    <p class="lede">AD / Internal Pentest — enter access key to open.</p>
    <form id="f" autocomplete="off" method="post" action="#">
      <label for="pw">Access key</label>
      <input id="pw" name="fm-access" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" required />
      <p class="err" id="err" role="alert"></p>
      <div class="row">
        <button type="submit" id="go">Unlock</button>
      </div>
    </form>
  </div>
  <script src="gate.js"></script>
</body>
</html>
